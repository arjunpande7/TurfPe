<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Game Map - Gurgaon</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        // UPDATED: Changed from Green to Light Blue
                        "primary": "#00C2FF",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0f172a", // Slightly bluer dark background
                        "surface-dark": "#1e293b",     // Slate tone to match blue
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                    boxShadow: {
                        // UPDATED: Blue glow instead of green
                        'glow': '0 0 15px rgba(0, 194, 255, 0.4)',
                    }
                },
            },
        }
    </script>

    <style>
        .map-container {
            /* Simulating a dark map style */
            filter: grayscale(0.8) contrast(1.2) brightness(0.6) hue-rotate(180deg);
        }
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display overflow-hidden h-screen w-full select-none">

    <div class="relative h-full w-full flex flex-col group/design-root">

        <div class="absolute inset-0 z-0 bg-[#0f172a]">
             <div class="w-full h-full bg-cover bg-center map-container"
                 data-alt="Dark themed map of Gurgaon streets"
                 data-location="Gurgaon, India"
                 style="background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2074&auto=format&fit=crop');">
            </div>

            <button class="absolute top-[30%] left-[20%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 group">
                <div class="w-10 h-10 bg-surface-dark rounded-full border-2 border-primary/50 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-primary text-[20px]">sports_soccer</span>
                </div>
            </button>

            <button class="absolute top-[25%] right-[25%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 group">
                <div class="w-10 h-10 bg-surface-dark rounded-full border-2 border-primary/50 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-primary text-[20px]">sports_soccer</span>
                </div>
            </button>

            <div class="absolute top-[48%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1 z-10">
                <div class="relative">
                    <div class="absolute inset-0 bg-primary rounded-full animate-ping opacity-75"></div>
                    <div class="relative w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-glow border-4 border-background-dark">
                        <span class="material-symbols-outlined text-white text-[28px] font-bold">trophy</span>
                    </div>
                </div>
                <div class="px-2 py-1 bg-background-dark rounded-md border border-primary/30 mt-1">
                    <p class="text-xs font-bold text-primary">Selected</p>
                </div>
            </div>
        </div>

        <div class="absolute top-0 left-0 right-0 z-20 pt-12 px-4 pb-4 bg-gradient-to-b from-background-dark/90 to-transparent">
            <div class="flex gap-3">
                <div class="flex-1 h-12 bg-surface-dark/90 backdrop-blur-md rounded-xl border border-white/10 shadow-lg flex items-center px-4 gap-3">
                    <span class="material-symbols-outlined text-blue-200">search</span>
                    <input class="bg-transparent border-none focus:ring-0 text-white placeholder-blue-200/50 w-full text-sm font-light" placeholder="Search in Gurgaon..." type="text"/>
                </div>
                <button class="h-12 w-12 bg-surface-dark/90 backdrop-blur-md rounded-xl border border-white/10 shadow-lg flex items-center justify-center active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-primary">tune</span>
                </button>
            </div>
        </div>

        <div class="absolute right-4 top-[180px] flex flex-col gap-3 z-10">
            <button class="h-10 w-10 bg-surface-dark/90 backdrop-blur rounded-lg border border-white/10 shadow-lg flex items-center justify-center text-white active:bg-surface-dark">
                <span class="material-symbols-outlined">my_location</span>
            </button>
            <button class="h-10 w-10 bg-surface-dark/90 backdrop-blur rounded-lg border border-white/10 shadow-lg flex items-center justify-center text-white active:bg-surface-dark">
                <span class="material-symbols-outlined">layers</span>
            </button>
        </div>

        <div class="absolute bottom-[90px] left-2 right-2 z-20">
            <div class="bg-surface-dark/95 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl overflow-hidden flex flex-col animate-[slideUp_0.3s_ease-out]">

                <div class="p-4 pb-2 flex justify-between items-start">
                    <div>
                        <div class="flex gap-2 mb-2">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-primary/10 border border-primary/20 text-primary text-[10px] uppercase font-bold tracking-wider">
                                <span class="material-symbols-outlined text-[12px]">trophy</span>
                                Competitive
                            </span>
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-white/5 border border-white/10 text-blue-200 text-[10px] uppercase font-bold tracking-wider">
                                Intermediate
                            </span>
                        </div>
                        <h2 class="text-white text-xl font-bold leading-tight">Sector 29 Turf</h2>
                        <p class="text-blue-200/70 text-sm mt-1 flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px]">schedule</span> 19:00 Tonight
                            <span class="mx-1">•</span>
                            <span class="material-symbols-outlined text-[16px]">location_on</span> Gurgaon, HR
                        </p>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-white font-bold text-lg">₹400</span>
                        <span class="text-blue-200/50 text-xs">per person</span>
                    </div>
                </div>

                <div class="px-4 py-3 border-t border-white/5 flex items-center justify-between gap-4">
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-white font-bold text-sm">8/10</span>
                            <span class="text-blue-200/50 text-xs">Players joined</span>
                        </div>
                        <div class="w-24 h-1.5 bg-white/10 rounded-full overflow-hidden">
                            <div class="h-full bg-primary w-[80%] rounded-full"></div>
                        </div>
                    </div>

                    <div class="flex -space-x-3">
                         <div class="w-8 h-8 rounded-full border-2 border-surface-dark bg-gray-600"></div>
                        <div class="w-8 h-8 rounded-full border-2 border-surface-dark bg-gray-500"></div>
                        <div class="w-8 h-8 rounded-full border-2 border-surface-dark bg-gray-400"></div>
                        <div class="w-8 h-8 rounded-full border-2 border-surface-dark bg-[#0c4a6e] flex items-center justify-center text-[10px] text-primary font-medium">
                            +5
                        </div>
                    </div>
                </div>

                <div class="p-4 pt-2 flex gap-3">
                    <button class="flex-1 bg-primary hover:bg-primary/90 text-white h-12 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-colors shadow-[0_0_20px_rgba(0,194,255,0.3)]">
                        Pay & Join
                        <span class="material-symbols-outlined text-[18px]">payments</span>
                    </button>
                    <button class="w-12 h-12 bg-white/5 hover:bg-white/10 text-white rounded-xl flex items-center justify-center border border-white/10 transition-colors">
                        <span class="material-symbols-outlined">near_me</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full h-[80px] bg-[#0f172a]/95 backdrop-blur-md border-t border-white/5 flex items-center justify-around px-2 z-30 pb-4">
            <button class="flex items-center gap-2 px-4 py-2 bg-primary/15 rounded-full text-primary transition-all duration-300">
                <span class="material-symbols-outlined fill-1">sports_soccer</span>
                <span class="text-sm font-semibold">Solo</span>
            </button>

            <button class="p-3 text-blue-200/40 hover:text-white transition-colors flex flex-col items-center justify-center">
                <span class="material-symbols-outlined">groups</span>
            </button>

            <button class="p-3 text-blue-200/40 hover:text-white transition-colors flex flex-col items-center justify-center">
                <span class="material-symbols-outlined">person</span>
            </button>

            <button class="p-3 text-blue-200/40 hover:text-white transition-colors flex flex-col items-center justify-center">
                <span class="material-symbols-outlined">add_circle</span>
            </button>

            <button class="p-3 text-blue-200/40 hover:text-white transition-colors flex flex-col items-center justify-center">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>

    </div>
</body>
</html>
